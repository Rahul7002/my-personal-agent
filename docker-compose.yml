# version: "3.8"

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_backend_db}
    ports:
      # Exposes 5432 to host so you can connect table viewer tools (DBeaver, TablePlus, pgAdmin)
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_backend_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Rate-Limiter Service
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      # Exposes 6379 to your Mac host for your local FastAPI app
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. pgAdmin UI
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"  # pgAdmin web UI will open on http://localhost:5050
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: ai-backend
data:
  PROJECT_NAME: "FastAPI AI Agent"
  LLM_PROVIDER: "groq"
  GROQ_MODEL: "openai/gpt-oss-120b"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  ALGORITHM: "HS256"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ai_db"
  POSTGRES_USER: "postgres"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
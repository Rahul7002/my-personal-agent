apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend-deployment
  labels:
    app: ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
        - name: ai-backend
          # Local image built previously
          image: ai-backend:v1
          # Do not try to pull from Docker Hub since it's stored locally
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            # 1. Pull non-sensitive settings from ConfigMap
            - configMapRef:
                name: backend-config
            # 2. Pull sensitive settings from Secret
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: "100m"      # 0.1 CPU core reserved
              memory: "128Mi"  # 128 MB RAM reserved
            limits:
              cpu: "500m"      # Max 0.5 CPU core
              memory: "512Mi"  # Max 512 MB RAM
          readinessProbe:
            # Kubernetes waits until this endpoint returns 200 before sending traffic
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Kubernetes restarts the container automatically if this fails
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
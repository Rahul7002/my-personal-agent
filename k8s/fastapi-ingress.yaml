apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-backend-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - rv-backend-ai.duckdns.org

  rules:
    - host: rv-backend-ai.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-backend-service
                port:
                  number: 8000

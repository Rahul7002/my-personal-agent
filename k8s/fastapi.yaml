apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend-deployment
  labels:
    app: ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
        - name: ai-backend
          image: ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "350Mi" # Kills just the pod (OOMKilled) rather than freezing the whole EC2 instance
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          env:
            # Composed connection strings for SQLAlchemy / Asyncpg & Redis
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          # Health checks to ensure traffic only hits healthy pods
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend-service
  labels:
    app: ai-backend
spec:
  type: ClusterIP
  selector:
    app: ai-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
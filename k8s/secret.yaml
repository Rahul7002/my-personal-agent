apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  labels:
    app: ai-backend
type: Opaque
stringData:
  # Database connection string
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/ai_backend_db"
  # JWT signing secret key
  SECRET_KEY: "super-secret-development-key-change-in-production-12345"
# 1. PostgreSQL Internal Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# 2. Redis Internal Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# 3. FastAPI Backend Service (Exposed via NodePort)
apiVersion: v1
kind: Service
metadata:
  name: ai-backend-service
  labels:
    app: ai-backend
spec:
  type: NodePort
  selector:
    app: ai-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080